<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<title>The Brandon McAllister Book Series</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="btn-home" class="icon-btn" title="Bookshelf">⌂</button>
    <div class="topbar-title" id="top-title">Book Series</div>
    <button id="btn-search" class="icon-btn" title="Search">⌕</button>
    <button id="btn-toc" class="icon-btn" title="Contents">☰</button>
  </header>

  <main id="main"></main>

  <aside id="toc-drawer" class="drawer" hidden>
    <div class="drawer-head"><strong>Contents</strong><button id="toc-close">✕</button></div>
    <div id="toc-tree" class="toc-tree"></div>
  </aside>

  <div id="search-modal" class="modal" hidden>
    <div class="modal-card">
      <h2>Search series</h2>
      <input id="search-input" type="search" placeholder="Search books, inventions, math…"/>
      <div id="search-results"></div>
      <button class="btn" id="search-close">Close</button>
      <button class="btn secondary" id="btn-open-local">Open Local File / Add Split Part</button>
      <input type="file" id="local-file" accept=".json,.md,.txt,.jsonl,.zip" hidden multiple/>
    </div>
  </div>

  <div id="print-modal" class="modal" hidden>
    <div class="modal-card">
      <h2>Print 49-Page Mini-Book</h2>
      <p>High-contrast B&W US Letter. Pick Book 1 PDF or assemble chapters.</p>
      <button class="btn" id="print-pdf">Download Book 1 PDF (49 pages)</button>
      <button class="btn secondary" id="print-view">Open Print View (≤49 pages)</button>
      <button class="btn secondary" id="print-close">Close</button>
    </div>
  </div>

  <div id="glossary-pop" class="glossary-pop" hidden>
    <strong id="g-term"></strong>
    <p id="g-def"></p>
    <button class="btn" id="g-back">Back to my spot</button>
  </div>

  <footer id="tts-bar" class="tts-bar" hidden>
    <button id="tts-play" class="btn">Read Aloud</button>
    <button id="tts-stop" class="btn secondary">Stop</button>
    <button id="tts-prev" class="icon-btn">⟵</button>
    <button id="tts-next" class="icon-btn">⟶</button>
    <select id="tts-rate" title="Speed">
      <option value="0.8">0.8x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2.0x</option>
    </select>
    <span id="tts-status" class="muted">Ready</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
